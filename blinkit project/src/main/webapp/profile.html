<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Profile - Blinkit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-container">

        <h1>My Profile</h1>

        <!-- User Information -->
        <div class="profile-card">

            <div class="profile-icon">
                👤
            </div>

            <h2 id="userName">User</h2>

            <p id="userMobile">Mobile Number</p>

        </div>


        <!-- Profile Options -->
        <div class="profile-menu">

            <!-- My Account -->
            <div class="menu-item">

                <span>👤</span>

                <a href="account.html">
                    My Account
                </a>

            </div>


            <!-- My Orders -->
            <div class="menu-item">

                <span>📦</span>

                <a href="orders.html">
                    My Orders
                </a>

            </div>


            <!-- My Address -->
            <div class="menu-item">

                <span>📍</span>

                <a href="address.html">
                    My Address
                </a>

            </div>


            <!-- Logout -->
            <div class="menu-item">

                <span>🚪</span>

                <a href="#" onclick="logout()">
                    Logout
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
