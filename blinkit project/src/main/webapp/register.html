<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blinkit Register</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-box">

        <h2>Create Account</h2>

        <p>Register your Blinkit account</p>

        <!-- NAME -->
        <input
            type="text"
            id="name"
            placeholder="Enter Name"
        >

        <!-- EMAIL -->
        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <!-- MOBILE -->
        <input
            type="text"
            id="phone"
            placeholder="Enter Mobile Number"
            maxlength="10"
            inputmode="numeric"
        >

        <!-- PASSWORD -->
        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

            <span
                onclick="togglePassword('password', this)"
            >👁️</span>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
            >

            <span
                onclick="togglePassword('confirmPassword', this)"
            >👁️</span>

        </div>

        <!-- REGISTER BUTTON -->
        <button
            type="button"
            onclick="registerUser()"
        >
            Register
        </button>

        <p>
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
